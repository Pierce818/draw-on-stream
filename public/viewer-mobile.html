<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Draw on Stream</title>
<style>
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #16161e;
  background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.035) 1px, transparent 0);
  background-size: 28px 28px;
  user-select: none; -webkit-user-select: none;
}

/* Canvases sit flat in body — zoom handled via JS transform */
#drawingCanvas {
  position: absolute; top: 0; left: 0;
  z-index: 1;
  transform-origin: 0 0;
  touch-action: none;
}
#guideCanvas {
  position: absolute; top: 0; left: 0;
  z-index: 2;
  pointer-events: none;
  transform-origin: 0 0;
}

/* ── Panel — always fixed, always interactive ── */
#controls {
  position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
  background: rgba(14, 14, 22, 0.93);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 20px; padding: 14px 18px;
  display: flex; flex-direction: column; gap: 10px;
  z-index: 9999; color: #dde0f0; font-size: 13px;
  width: min(360px, 92vw);
  box-shadow: 0 12px 48px rgba(0,0,0,0.65), 0 1px 0 rgba(255,255,255,0.05) inset;
  touch-action: auto;
  -webkit-tap-highlight-color: transparent;
}
#controls.minimized > *:not(.ctrl-header) { display: none !important; }
#controls.minimized { padding: 10px 14px; width: auto; min-width: 0; }

.ctrl-header { display: flex; align-items: center; gap: 8px; }
.ctrl-title { flex: 1; font-size: 11px; font-weight: 700; letter-spacing: 1.1px; text-transform: uppercase; color: #7070a0; }
.ctrl-icon-btn {
  background: rgba(255,255,255,0.07); color: #888; border: none;
  border-radius: 8px; width: 34px; height: 34px;
  cursor: pointer; font-size: 16px; line-height: 1;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.18s; flex-shrink: 0;
  -webkit-tap-highlight-color: transparent;
}
.ctrl-hint { font-size: 11px; color: #555; text-align: center; }
.ctrl-divider { height: 1px; background: rgba(255,255,255,0.07); }

#nameRow { display: flex; gap: 8px; align-items: center; }
#nameInput {
  flex: 1; background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.1); border-radius: 10px;
  padding: 10px 12px; color: #fff; font-size: 16px; /* 16px prevents iOS zoom-on-focus */
  outline: none; transition: border-color 0.2s;
}
#nameInput:focus { border-color: rgba(130,180,255,0.5); }
#nameInput::placeholder { color: rgba(255,255,255,0.22); }
#setNameBtn {
  background: rgba(100,160,255,0.18); color: #90b8ff;
  border: 1px solid rgba(100,160,255,0.28); border-radius: 10px;
  padding: 10px 14px; cursor: pointer; font-size: 13px; font-weight: 700;
  white-space: nowrap; -webkit-tap-highlight-color: transparent;
}

#userBadge {
  display: none; align-items: center; gap: 8px;
  background: rgba(255,255,255,0.06); border-radius: 10px; padding: 7px 12px;
}
#userDot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
#userNameDisplay { font-size: 13px; font-weight: 700; color: #fff; flex: 1; }
#changeNameBtn { font-size: 11px; color: rgba(255,255,255,0.3); cursor: pointer; }

/* Color swatches — larger for touch, cursor:pointer required for iOS click events on divs */
#colorPicker { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
.color-btn {
  width: 34px; height: 34px; border-radius: 8px;
  cursor: pointer; /* required for iOS Safari to fire click on divs */
  border: 2px solid transparent;
  transition: border-color 0.12s, box-shadow 0.12s;
  flex-shrink: 0;
  -webkit-tap-highlight-color: transparent;
}
.color-btn.selected { border-color: #fff; box-shadow: 0 0 0 3px rgba(255,255,255,0.18); }
#eraserBtn {
  width: 34px; height: 34px; border-radius: 8px;
  cursor: pointer;
  background: rgba(255,255,255,0.08); border: 2px dashed rgba(255,255,255,0.28);
  color: rgba(255,255,255,0.45); font-size: 15px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; -webkit-tap-highlight-color: transparent;
}
#eraserBtn.selected { border-color: #fff; border-style: solid; background: rgba(255,255,255,0.18); color: #fff; }

.brush-row { display: flex; align-items: center; gap: 10px; }
#brushPreviewWrap { width: 34px; height: 34px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
#brushPreviewCircle { border-radius: 50%; transition: all 0.15s; }
#brushSize {
  flex: 1; -webkit-appearance: none; appearance: none;
  height: 6px; border-radius: 3px; background: rgba(255,255,255,0.12); outline: none;
}
#brushSize::-webkit-slider-thumb {
  -webkit-appearance: none; width: 26px; height: 26px; border-radius: 50%;
  background: #c0c0e0; box-shadow: 0 1px 4px rgba(0,0,0,0.5);
}
#brushSizeLabel { font-size: 12px; color: #666; min-width: 30px; text-align: right; }

.users-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-height: 22px; }
#onlineCount { font-size: 11px; color: #555; white-space: nowrap; margin-right: 2px; }
.user-pip { display: flex; align-items: center; gap: 5px; background: rgba(255,255,255,0.07); border-radius: 6px; padding: 3px 8px; font-size: 12px; color: #aaa; }
.user-pip-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

#voteClear {
  background: rgba(255,55,55,0.14); color: #ff8888;
  border: 1px solid rgba(255,55,55,0.28); border-radius: 10px;
  padding: 12px; cursor: pointer; font-size: 13px; font-weight: 700;
  text-align: center; width: 100%; -webkit-tap-highlight-color: transparent;
}
#voteClear:disabled { opacity: 0.3; }
</style>
</head>
<body>

<canvas id="drawingCanvas"></canvas>
<canvas id="guideCanvas"></canvas>

<div id="controls">
  <div class="ctrl-header">
    <span class="ctrl-title">Draw on Stream</span>
    <button id="resetViewBtn" class="ctrl-icon-btn" title="Reset zoom">⊡</button>
    <button id="minimizeBtn" class="ctrl-icon-btn">−</button>
  </div>

  <div id="nameRow">
    <input id="nameInput" placeholder="Your Twitch username" maxlength="25" autocomplete="off" />
    <button id="setNameBtn">Set</button>
  </div>
  <div id="userBadge">
    <div id="userDot"></div>
    <span id="userNameDisplay"></span>
    <span id="changeNameBtn">change</span>
  </div>

  <div class="ctrl-divider"></div>
  <div id="colorPicker"></div>

  <div class="brush-row">
    <div id="brushPreviewWrap"><div id="brushPreviewCircle"></div></div>
    <input type="range" id="brushSize" min="1" max="40" value="6" />
    <span id="brushSizeLabel">6px</span>
  </div>

  <div class="ctrl-divider"></div>

  <div class="users-row">
    <span id="onlineCount">0 online</span>
    <div id="usersList" style="display:flex;gap:6px;flex-wrap:wrap;"></div>
  </div>

  <button id="voteClear">Vote to Clear Canvas</button>
  <p class="ctrl-hint">Pinch to zoom · Double-tap canvas to reset</p>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
socket.emit("setType", "viewer");

// ── Canvases ──────────────────────────────────────────────────────────────────
const drawCanvas  = document.getElementById("drawingCanvas");
const drawCtx     = drawCanvas.getContext("2d");
const guideCanvas = document.getElementById("guideCanvas");
const guideCtx    = guideCanvas.getContext("2d");
const controlsDiv = document.getElementById("controls");

function resizeAll() {
  const w = window.innerWidth, h = window.innerHeight;
  drawCanvas.width  = w; drawCanvas.height  = h;
  guideCanvas.width = w; guideCanvas.height = h;
  resetView();
}
resizeAll();
window.addEventListener("resize", resizeAll);

// ── View transform ────────────────────────────────────────────────────────────
let viewScale = 1, viewX = 0, viewY = 0;
const MIN_SCALE = 1, MAX_SCALE = 8;

function applyTransform() {
  // Apply the same CSS transform to both canvases
  const t = `translate(${viewX}px,${viewY}px) scale(${viewScale})`;
  drawCanvas.style.transform  = t;
  guideCanvas.style.transform = t;
}
function clampView() {
  viewX = Math.max(Math.min(0, window.innerWidth  - drawCanvas.width  * viewScale), Math.min(0, viewX));
  viewY = Math.max(Math.min(0, window.innerHeight - drawCanvas.height * viewScale), Math.min(0, viewY));
}
function resetView() {
  viewScale = 1; viewX = 0; viewY = 0;
  applyTransform();
}
function toCanvas(sx, sy) {
  return { x: (sx - viewX) / viewScale, y: (sy - viewY) / viewScale };
}

// ── State ─────────────────────────────────────────────────────────────────────
let username    = "";
let myZoneColor = "#888";
let drawing     = false;
let drawStarted = false;
let color       = "#FF4444";
let isEraser    = false;
let brushSize   = 6;
let prevX = null, prevY = null;
let zoneIndex   = 0;
let zoneWidth   = 0.225;
let onlineUsers = {};

let pinching      = false;
let lastPinchDist = 0;
let lastPinchMidX = 0, lastPinchMidY = 0;
let lastTapTime   = 0;

// ── Username ──────────────────────────────────────────────────────────────────
const nameInput       = document.getElementById("nameInput");
const setNameBtn      = document.getElementById("setNameBtn");
const nameRow         = document.getElementById("nameRow");
const userBadge       = document.getElementById("userBadge");
const userDot         = document.getElementById("userDot");
const userNameDisplay = document.getElementById("userNameDisplay");

function applyUsername(name) {
  if (!name) return;
  username = name;
  socket.emit("setUsername", username);
  nameRow.style.display = "none";
  userDot.style.background = myZoneColor;
  userNameDisplay.textContent = username;
  userBadge.style.display = "flex";
}
setNameBtn.addEventListener("click", () => applyUsername(nameInput.value.trim()));
nameInput.addEventListener("keydown", e => { if (e.key === "Enter") { nameInput.blur(); applyUsername(nameInput.value.trim()); } });
document.getElementById("changeNameBtn").addEventListener("click", () => {
  username = "";
  userBadge.style.display = "none";
  nameRow.style.display = "flex";
  nameInput.value = "";
});

// ── Colors ────────────────────────────────────────────────────────────────────
const colorList = ["#FF4444","#FF8800","#FFE000","#44DD55","#00DDDD","#4488FF","#AA44FF","#FF44AA","#FFFFFF","#333333"];
const colorPickerEl = document.getElementById("colorPicker");
colorList.forEach(c => {
  const btn = document.createElement("div");
  btn.className = "color-btn";
  btn.style.background = c;
  if (c === "#FFFFFF") btn.style.outline = "1px solid rgba(255,255,255,0.2)";
  btn.addEventListener("click", () => selectColor(c, btn));
  colorPickerEl.appendChild(btn);
});
colorPickerEl.firstChild.classList.add("selected");
color = colorList[0];

const eraserBtn = document.createElement("div");
eraserBtn.id = "eraserBtn"; eraserBtn.title = "Eraser"; eraserBtn.textContent = "✕";
eraserBtn.addEventListener("click", selectEraser);
colorPickerEl.appendChild(eraserBtn);

function selectColor(c, btn) {
  colorPickerEl.querySelectorAll(".color-btn").forEach(b => b.classList.remove("selected"));
  eraserBtn.classList.remove("selected");
  if (btn) btn.classList.add("selected");
  color = c; isEraser = false;
  updateBrushPreview();
}
function selectEraser() {
  colorPickerEl.querySelectorAll(".color-btn").forEach(b => b.classList.remove("selected"));
  eraserBtn.classList.add("selected");
  isEraser = true;
  updateBrushPreview();
}

// ── Brush ─────────────────────────────────────────────────────────────────────
const brushPreviewCircle = document.getElementById("brushPreviewCircle");
const brushSizeInput     = document.getElementById("brushSize");
const brushSizeLabelEl   = document.getElementById("brushSizeLabel");

function updateBrushPreview() {
  const sz = Math.min(brushSize, 30);
  brushPreviewCircle.style.width      = sz + "px";
  brushPreviewCircle.style.height     = sz + "px";
  brushPreviewCircle.style.background = isEraser ? "rgba(255,255,255,0.15)" : color;
  brushPreviewCircle.style.border     = isEraser ? "2px dashed rgba(255,255,255,0.4)" : "none";
}
brushSizeInput.addEventListener("input", e => {
  brushSize = parseInt(e.target.value);
  brushSizeLabelEl.textContent = brushSize + "px";
  updateBrushPreview();
});
updateBrushPreview();

// ── Controls ──────────────────────────────────────────────────────────────────
const minimizeBtn = document.getElementById("minimizeBtn");
let minimized = false;
minimizeBtn.addEventListener("click", () => {
  minimized = !minimized;
  controlsDiv.classList.toggle("minimized", minimized);
  minimizeBtn.textContent = minimized ? "+" : "−";
});
document.getElementById("resetViewBtn").addEventListener("click", resetView);

const voteClearBtn = document.getElementById("voteClear");
voteClearBtn.addEventListener("click", () => {
  socket.emit("voteClear");
  voteClearBtn.disabled = true;
});

// ── Socket events ─────────────────────────────────────────────────────────────
socket.on("zoneAssigned", data => {
  zoneIndex   = data.index;
  zoneWidth   = data.width;
  myZoneColor = data.color;
  userDot.style.background = myZoneColor;
});
socket.on("userList", list => {
  list.forEach(u => { onlineUsers[u.user] = { zoneIndex: u.zoneIndex, color: u.color }; });
  renderUsersList();
});
socket.on("userUpdate", data => {
  onlineUsers[data.user] = { zoneIndex: data.zoneIndex, color: data.color };
  renderUsersList();
});
socket.on("userLeft", data => {
  delete onlineUsers[data.user];
  renderUsersList();
});
socket.on("draw", data => applyDrawData(drawCtx, data));
socket.on("clearCanvas", () => {
  drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
  drawStarted = false;
  voteClearBtn.disabled = false;
});

function applyDrawData(ctx, data) {
  if (data.isEraser) {
    ctx.globalCompositeOperation = "destination-out";
    ctx.beginPath(); ctx.moveTo(data.prevX, data.prevY); ctx.lineTo(data.x, data.y);
    ctx.lineWidth = data.size; ctx.lineCap = "round"; ctx.stroke();
    ctx.globalCompositeOperation = "source-over";
  } else {
    ctx.beginPath(); ctx.moveTo(data.prevX, data.prevY); ctx.lineTo(data.x, data.y);
    ctx.strokeStyle = data.color; ctx.lineWidth = data.size; ctx.lineCap = "round";
    ctx.stroke(); ctx.closePath();
  }
}

// ── Online users ──────────────────────────────────────────────────────────────
function renderUsersList() {
  const list  = document.getElementById("usersList");
  const count = document.getElementById("onlineCount");
  list.innerHTML = "";
  const entries = Object.entries(onlineUsers);
  count.textContent = entries.length + " online";
  entries.slice(0, 6).forEach(([name, info]) => {
    const pip = document.createElement("div");
    pip.className = "user-pip";
    pip.innerHTML = `<div class="user-pip-dot" style="background:${info.color}"></div><span>${name}</span>`;
    list.appendChild(pip);
  });
  if (entries.length > 6) {
    const more = document.createElement("div");
    more.className = "user-pip";
    more.textContent = `+${entries.length - 6}`;
    list.appendChild(more);
  }
}

// ── Zone guide ────────────────────────────────────────────────────────────────
function drawZoneGuide() {
  guideCtx.clearRect(0, 0, guideCanvas.width, guideCanvas.height);
  const startX   = zoneIndex * drawCanvas.width * zoneWidth;
  const zoneSize = Math.min(drawCanvas.width * zoneWidth, drawCanvas.height * 0.5);

  guideCtx.fillStyle = "rgba(255,255,255,0.025)";
  guideCtx.fillRect(startX, 0, zoneSize, zoneSize);

  guideCtx.strokeStyle = myZoneColor + "90";
  guideCtx.lineWidth = 1.5;
  guideCtx.setLineDash([8, 5]);
  guideCtx.strokeRect(startX + 1, 1, zoneSize - 2, zoneSize - 2);
  guideCtx.setLineDash([]);

  const a = 16;
  guideCtx.strokeStyle = myZoneColor;
  guideCtx.lineWidth = 3;
  [[startX,0,startX+a,0],[startX,0,startX,a],
   [startX+zoneSize,0,startX+zoneSize-a,0],[startX+zoneSize,0,startX+zoneSize,a],
   [startX,zoneSize,startX+a,zoneSize],[startX,zoneSize,startX,zoneSize-a],
   [startX+zoneSize,zoneSize,startX+zoneSize-a,zoneSize],[startX+zoneSize,zoneSize,startX+zoneSize,zoneSize-a]
  ].forEach(([x1,y1,x2,y2]) => {
    guideCtx.beginPath(); guideCtx.moveTo(x1,y1); guideCtx.lineTo(x2,y2); guideCtx.stroke();
  });

  if (!drawStarted && username) {
    guideCtx.font = "bold 18px -apple-system, sans-serif";
    guideCtx.fillStyle = "rgba(255,255,255,0.4)";
    guideCtx.textAlign = "center";
    guideCtx.fillText("Draw here!", startX + zoneSize / 2, zoneSize / 2);
  }
  if (!username) {
    guideCtx.font = "bold 14px -apple-system, sans-serif";
    guideCtx.fillStyle = "rgba(255,220,100,0.85)";
    guideCtx.textAlign = "center";
    guideCtx.fillText("Set your Twitch username above to start drawing", drawCanvas.width / 2, 52);
  }
}
setInterval(drawZoneGuide, 120);

// ── Touch events (on body, skip if target is inside controls) ─────────────────
document.body.addEventListener("touchstart", e => {
  // Let the controls panel handle its own touches
  if (controlsDiv.contains(e.target)) return;
  e.preventDefault();

  if (e.touches.length === 1) {
    const now = Date.now();
    if (now - lastTapTime < 280) { resetView(); lastTapTime = 0; return; }
    lastTapTime = now;

    if (!pinching && username) {
      drawing = true; drawStarted = true;
      const c = toCanvas(e.touches[0].clientX, e.touches[0].clientY);
      prevX = c.x; prevY = c.y;
    }
  } else if (e.touches.length === 2) {
    drawing = false; prevX = null; prevY = null;
    pinching = true;
    lastPinchDist = Math.hypot(
      e.touches[1].clientX - e.touches[0].clientX,
      e.touches[1].clientY - e.touches[0].clientY
    );
    lastPinchMidX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
    lastPinchMidY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
  }
}, { passive: false });

document.body.addEventListener("touchmove", e => {
  if (controlsDiv.contains(e.target)) return;
  e.preventDefault();

  if (e.touches.length === 1 && !pinching && drawing && username) {
    const c = toCanvas(e.touches[0].clientX, e.touches[0].clientY);
    let x = c.x, y = c.y;
    const startX   = zoneIndex * drawCanvas.width * zoneWidth;
    const zoneSize = Math.min(drawCanvas.width * zoneWidth, drawCanvas.height * 0.5);
    x = Math.max(startX, Math.min(x, startX + zoneSize));
    y = Math.max(0,      Math.min(y, zoneSize));

    if (prevX !== null && prevY !== null) {
      const data = { user: username, color, size: brushSize, prevX, prevY, x, y, zoneIndex, isEraser };
      applyDrawData(drawCtx, data);
      socket.emit("draw", data);
    }
    prevX = x; prevY = y;

  } else if (e.touches.length === 2) {
    const dist = Math.hypot(
      e.touches[1].clientX - e.touches[0].clientX,
      e.touches[1].clientY - e.touches[0].clientY
    );
    const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
    const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;

    const newScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, viewScale * (dist / lastPinchDist)));
    viewX = midX - (midX - viewX) * (newScale / viewScale);
    viewY = midY - (midY - viewY) * (newScale / viewScale);
    viewScale = newScale;
    viewX += midX - lastPinchMidX;
    viewY += midY - lastPinchMidY;
    clampView();
    applyTransform();

    lastPinchDist = dist;
    lastPinchMidX = midX;
    lastPinchMidY = midY;
  }
}, { passive: false });

document.body.addEventListener("touchend", e => {
  if (e.touches.length === 0) {
    drawing = false; prevX = null; prevY = null; pinching = false;
  } else if (e.touches.length === 1 && pinching) {
    pinching = false; drawing = false; prevX = null; prevY = null;
  }
});

document.body.addEventListener("touchcancel", () => {
  drawing = false; prevX = null; prevY = null; pinching = false;
});
</script>
</body>
</html>
