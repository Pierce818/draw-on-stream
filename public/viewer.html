<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Draw Viewer</title>
<style>
html, body { margin:0; padding:0; }
#drawCanvas { border:1px solid #ccc; touch-action: none; }
#ui { position:fixed; top:10px; left:10px; background:white; padding:10px; border-radius:8px; box-shadow:0 2px 6px rgba(0,0,0,0.2);}
</style>
</head>
<body>
<div id="ui">
  <input type="text" id="usernameInput" placeholder="Enter your name">
  <input type="color" id="colorPicker" value="#ff0000">
</div>
<canvas id="drawCanvas" width="800" height="600"></canvas>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const canvas = document.getElementById("drawCanvas");
const ctx = canvas.getContext("2d");
const usernameInput = document.getElementById("usernameInput");
const colorPicker = document.getElementById("colorPicker");

let drawing=false, prevX=null, prevY=null, drawStarted=false;
let username="";

// Assign each user a zone index
let zoneIndex=0; // could be dynamic for multiple users

canvas.addEventListener("pointerdown", e=>{
  username = usernameInput.value.trim();
  if(!username) return alert("Enter your username first!");
  drawing=true;
  drawStarted=true;
  const rect=canvas.getBoundingClientRect();
  prevX=(e.clientX-rect.left)/Math.min(canvas.width * 0.225, canvas.height * 0.5);
  prevY=(e.clientY-rect.top)/Math.min(canvas.width * 0.225, canvas.height * 0.5);
});

canvas.addEventListener("pointermove", e=>{
  if(!drawing || !username) return;
  const rect=canvas.getBoundingClientRect();
  const normX=(e.clientX-rect.left)/Math.min(canvas.width * 0.225, canvas.height * 0.5);
  const normY=(e.clientY-rect.top)/Math.min(canvas.width * 0.225, canvas.height * 0.5);
  
  socket.emit("draw", {user:username, normX, normY, color: colorPicker.value, size:4, zoneIndex});
  prevX=normX;
  prevY=normY;
});

function stopDraw(){
  if(username){
    drawing=false;
    prevX=null;
    prevY=null;
    drawStarted=false;
    socket.emit("stopDraw", username);
  }
}

canvas.addEventListener("pointerup", stopDraw);
canvas.addEventListener("pointerleave", stopDraw);
canvas.addEventListener("touchend", stopDraw);

</script>
</body>
</html>
