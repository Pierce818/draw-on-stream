<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Overlay</title>
<style>
html, body { margin:0; padding:0; overflow:hidden; background:transparent; }
canvas { position:absolute; top:0; left:0; width:100%; height:100%; }
</style>
</head>
<body>
<canvas id="overlayCanvas"></canvas>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const overlay = document.getElementById("overlayCanvas");
const ctx = overlay.getContext("2d");
overlay.width = window.innerWidth;
overlay.height = window.innerHeight;

let userStrokes = {}; // track last positions per user

socket.on("draw", data=>{
  const {user,color,size,normX,normY,zoneIndex} = data;

  const zoneStartX = zoneIndex * overlay.width * 0.225;
  const zoneSize = Math.min(overlay.width*0.225, overlay.height*0.5);

  const x = zoneStartX + normX*zoneSize;
  const y = normY*zoneSize;

  if(!userStrokes[user]) userStrokes[user]={prevX:null, prevY:null};

  if(userStrokes[user].prevX!==null && userStrokes[user].prevY!==null){
    ctx.beginPath();
    ctx.moveTo(userStrokes[user].prevX, userStrokes[user].prevY);
    ctx.lineTo(x, y);
    ctx.strokeStyle=color;
    ctx.lineWidth=size;
    ctx.lineCap="round";
    ctx.stroke();
    ctx.closePath();
  }

  userStrokes[user].prevX = x;
  userStrokes[user].prevY = y;
});

socket.on("clearCanvas", ()=>{
  ctx.clearRect(0,0,overlay.width, overlay.height);
  userStrokes={};
});
</script>
</body>
</html>
