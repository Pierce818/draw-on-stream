<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Draw on Stream - Overlay</title>
<style>
html, body { margin:0; padding:0; overflow:hidden; font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background:transparent; }
canvas { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; }
#drawingCanvas { z-index:1; }
.username { position:absolute; z-index:2; pointer-events:none; font-family:'Segoe UI', sans-serif; color:#000; font-weight:bold; }
</style>
</head>
<body>
<canvas id="drawingCanvas"></canvas>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const drawCanvas = document.getElementById("drawingCanvas");
const drawCtx = drawCanvas.getContext("2d");
drawCanvas.width = window.innerWidth;
drawCanvas.height = window.innerHeight;

let users = {}; // { username: zoneIndex }

socket.on("draw", data => {
  drawCtx.beginPath();
  drawCtx.moveTo(data.prevX, data.prevY);
  drawCtx.lineTo(data.x, data.y);
  drawCtx.strokeStyle = data.color;
  drawCtx.lineWidth = data.size;
  drawCtx.lineCap = "round";
  drawCtx.stroke();
  drawCtx.closePath();
});

socket.on("userUpdate", data => {
  users[data.user] = data.zoneIndex;

  document.querySelectorAll(".username").forEach(el => el.remove());

  Object.keys(users).forEach(u => {
    const label = document.createElement("div");
    label.className = "username";
    label.style.left = (users[u] * drawCanvas.width * 0.225 + 10) + "px";
    label.style.top = "10px";
    label.textContent = u;
    document.body.appendChild(label);
  });
});

socket.on("clearCanvas", ()=>{
  drawCtx.clearRect(0,0,drawCanvas.width,drawCanvas.height);
  document.querySelectorAll(".username").forEach(el => el.remove());
  users = {};
});
</script>
</body>
</html>
