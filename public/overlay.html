<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Draw on Stream – Overlay</title>
<style>
html, body { margin: 0; padding: 0; overflow: hidden; background: transparent; }
canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
#drawingCanvas { z-index: 1; }

.zone-label {
  position: absolute;
  z-index: 2;
  pointer-events: none;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Arial Black', sans-serif;
  font-size: 16px;
  font-weight: 900;
  letter-spacing: 0.4px;
  white-space: nowrap;
  color: #fff;
  padding: 5px 16px 6px;
  border-radius: 24px;
  text-shadow: 0 1px 4px rgba(0,0,0,0.45);
  box-shadow: 0 3px 14px rgba(0,0,0,0.4);
  transform: translateX(-50%);
  transition: opacity 0.3s;
}
</style>
</head>
<body>
<canvas id="drawingCanvas"></canvas>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
socket.emit("setType", "overlay");

const drawCanvas = document.getElementById("drawingCanvas");
const drawCtx    = drawCanvas.getContext("2d");
drawCanvas.width  = window.innerWidth;
drawCanvas.height = window.innerHeight;

const zoneWidth = 0.225;
let users = {}; // { name: { zoneIndex, color, labelEl } }

function createLabel(name, color, zoneIndex) {
  const zoneW   = drawCanvas.width * zoneWidth;
  const centerX = zoneIndex * zoneW + zoneW / 2;

  const el = document.createElement("div");
  el.className = "zone-label";
  el.textContent = name;
  el.style.background  = color + "d0"; // ~82% opacity
  el.style.left        = centerX + "px";
  el.style.top         = "12px";
  document.body.appendChild(el);
  return el;
}

function ensureLabel(name) {
  const info = users[name];
  if (!info || info.labelEl) return;
  info.labelEl = createLabel(name, info.color, info.zoneIndex);
}

function updateAllLabels() {
  Object.keys(users).forEach(ensureLabel);
}

function removeLabel(name) {
  if (users[name] && users[name].labelEl) {
    users[name].labelEl.remove();
    users[name].labelEl = null;
  }
}

function applyDrawData(data) {
  if (data.isEraser) {
    drawCtx.globalCompositeOperation = "destination-out";
    drawCtx.beginPath();
    drawCtx.moveTo(data.prevX, data.prevY);
    drawCtx.lineTo(data.x, data.y);
    drawCtx.lineWidth = data.size;
    drawCtx.lineCap   = "round";
    drawCtx.stroke();
    drawCtx.globalCompositeOperation = "source-over";
  } else {
    drawCtx.beginPath();
    drawCtx.moveTo(data.prevX, data.prevY);
    drawCtx.lineTo(data.x, data.y);
    drawCtx.strokeStyle = data.color;
    drawCtx.lineWidth   = data.size;
    drawCtx.lineCap     = "round";
    drawCtx.stroke();
    drawCtx.closePath();
  }
}

socket.on("draw", data => applyDrawData(data));

socket.on("userList", list => {
  list.forEach(u => {
    users[u.user] = { zoneIndex: u.zoneIndex, color: u.color, labelEl: null };
  });
  updateAllLabels();
});

socket.on("userUpdate", data => {
  removeLabel(data.user); // remove old label if it exists (handles color/zone change)
  users[data.user] = { zoneIndex: data.zoneIndex, color: data.color, labelEl: null };
  ensureLabel(data.user);
});

socket.on("userLeft", data => {
  removeLabel(data.user);
  delete users[data.user];
});

socket.on("clearCanvas", () => {
  drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
});
</script>
</body>
</html>
