<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Draw Overlay</title>
<style>
html, body { margin:0; padding:0; overflow:hidden; background:transparent; }
canvas { position:absolute; top:0; left:0; width:100%; height:100%; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// Keep track of each user's last point and drawing state
const users = {};

// Draw event from viewer
socket.on("draw", data => {
  const zoneSize = Math.min(canvas.width * 0.225, canvas.height * 0.5);
  const zoneStartX = data.zoneIndex * canvas.width * 0.225;

  const x = zoneStartX + data.normX * zoneSize;
  const y = data.normY * zoneSize;

  // Only draw if user is actively drawing
  if(users[data.user]?.drawing){
    const last = users[data.user].last;
    ctx.beginPath();
    ctx.moveTo(last.x, last.y);
    ctx.lineTo(x, y);
    ctx.strokeStyle = data.color;
    ctx.lineWidth = data.size;
    ctx.lineCap = "round";
    ctx.stroke();
    ctx.closePath();
  }

  // Update user state
  users[data.user] = { last:{x, y}, username: data.user, drawing:true, zoneIndex:data.zoneIndex, color:data.color };

  // Draw username above their zone
  ctx.font = "16px Arial";
  ctx.fillStyle = data.color;
  ctx.textAlign = "center";
  ctx.fillText(data.user, zoneStartX + zoneSize/2, 20);
});

// Stop drawing when viewer releases mouse/finger
socket.on("stopDraw", username=>{
  if(users[username]) users[username].drawing = false;
});

// Clear canvas
socket.on("clearCanvas", ()=>{
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for(const u in users) delete users[u];
});
</script>
</body>
</html>
