<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Draw Overlay</title>
<style>
html, body { margin:0; padding:0; overflow:hidden; }
canvas { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; }
.username {
  position:absolute; font-family:Arial; font-size:16px; color:white; text-shadow:0 0 4px black;
}
</style>
</head>
<body>
<canvas id="overlayCanvas"></canvas>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const canvas = document.getElementById("overlayCanvas");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// Track users
let users = {}; // user -> { zoneIndex, color, lastX, lastY }

socket.on("draw", data=>{
  const { user, color, size, normX, normY, zoneIndex } = data;
  const zoneSize = Math.min(canvas.width * 0.225, canvas.height*0.5);
  const zoneStartX = zoneIndex * canvas.width * 0.225;

  const x = zoneStartX + normX * zoneSize;
  const y = normY * zoneSize;

  if(!users[user]) users[user]={ lastX:null, lastY:null, zoneIndex, color };
  const u = users[user];

  ctx.strokeStyle = color;
  ctx.lineWidth = size;
  ctx.lineCap = "round";

  if(u.lastX!==null && u.lastY!==null){
    ctx.beginPath();
    ctx.moveTo(u.lastX, u.lastY);
    ctx.lineTo(x, y);
    ctx.stroke();
    ctx.closePath();
  }
  u.lastX = x;
  u.lastY = y;
});

// Clear
socket.on("clearCanvas", ()=>{
  ctx.clearRect(0,0,canvas.width,canvas.height);
  Object.keys(users).forEach(u=>{
    users[u].lastX = null;
    users[u].lastY = null;
  });
});

// Username labels
socket.on("userUpdate", data=>{
  const { user, zoneIndex } = data;
  users[user] = users[user] || { lastX:null, lastY:null, zoneIndex };
  // Remove old labels
  document.querySelectorAll(".username").forEach(el=>el.remove());

  const label = document.createElement("div");
  label.className="username";
  const zoneSize = Math.min(canvas.width * 0.225, canvas.height*0.5);
  const zoneStartX = zoneIndex * canvas.width * 0.225;
  label.style.left = (zoneStartX + 10) + "px";
  label.style.top = "10px";
  label.textContent = user;
  document.body.appendChild(label);
});
</script>
</body>
</html>
