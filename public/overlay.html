<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Draw Overlay</title>
<style>
html, body { margin:0; padding:0; overflow:hidden; background:transparent; }
canvas { position:absolute; top:0; left:0; width:100%; height:100%; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// Users object stores last position and username per user
const users = {};

socket.on("draw", data => {
  const zoneWidth = Math.min(canvas.width * 0.225, canvas.height * 0.5); 
  const zoneStartX = data.zoneIndex * canvas.width * 0.225;

  const x = zoneStartX + data.normX * zoneWidth;
  const y = data.normY * zoneWidth;

  const last = users[data.user]?.last || {x, y};

  ctx.beginPath();
  ctx.moveTo(last.x, last.y);
  ctx.lineTo(x, y);
  ctx.strokeStyle = data.color;
  ctx.lineWidth = data.size;
  ctx.lineCap = "round";
  ctx.stroke();
  ctx.closePath();

  // Draw username above zone
  ctx.font = "16px Arial";
  ctx.fillStyle = data.color;
  ctx.textAlign = "center";
  ctx.fillText(data.user, zoneStartX + zoneWidth/2, zoneWidth + 18);

  users[data.user] = { last:{x,y}, username: data.user };
});

socket.on("clearCanvas", ()=>{
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for(const u in users) delete users[u];
});
</script>
</body>
</html>
