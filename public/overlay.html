<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Draw Overlay</title>
<style>
html, body { margin:0; padding:0; overflow:hidden; background:transparent; }
canvas { position:absolute; top:0; left:0; width:100%; height:100%; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// Users object: stores username, drawing state, per-stroke last point, zone, and color
const users = {};

// Draw event from viewer
socket.on("draw", data => {
    const zoneWidth = Math.min(canvas.width * 0.225, canvas.height * 0.5); 
    const zoneStartX = data.zoneIndex * canvas.width * 0.225;

    const x = zoneStartX + data.normX * zoneWidth;
    const y = data.normY * zoneWidth;

    // Only draw if the user is actively drawing and has a lastStroke
    if(users[data.user]?.drawing && users[data.user].lastStroke){
        const last = users[data.user].lastStroke;
        ctx.beginPath();
        ctx.moveTo(last.x, last.y);
        ctx.lineTo(x, y);
        ctx.strokeStyle = data.color;
        ctx.lineWidth = data.size;
        ctx.lineCap = "round";
        ctx.stroke();
        ctx.closePath();
    }

    // Update the per-stroke last point
    users[data.user] = {
        ...users[data.user],
        lastStroke: {x, y},
        drawing: true,
        username: data.user,
        zoneIndex: data.zoneIndex,
        color: data.color
    };

    // Draw username above the zone
    ctx.font = "16px Arial";
    ctx.fillStyle = data.color;
    ctx.textAlign = "center";
    ctx.fillText(data.user, zoneStartX + zoneWidth / 2, zoneWidth + 18);
});

// Stop drawing event
socket.on("stopDraw", username => {
    if(users[username]){
        users[username].drawing = false;
        users[username].lastStroke = null; // important: forget last point to prevent snapping
    }
});

// Clear canvas
socket.on("clearCanvas", () => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for(const u in users) delete users[u];
});
</script>
</body>
</html>
