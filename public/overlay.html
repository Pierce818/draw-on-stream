<!DOCTYPE html>
<html>
<head>
  <title>Overlay</title>
  <style>
    html, body { margin:0; padding:0; overflow:hidden; background:transparent; }
    canvas { position:absolute; top:0; left:0; width:100%; height:100%; }
  </style>
</head>
<body>
<canvas id="overlayCanvas"></canvas>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const canvas = document.getElementById("overlayCanvas");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let userData = {};

socket.on("draw", data=>{
  if(!userData[data.user]){
    userData[data.user] = {prevX:data.x, prevY:data.y, zoneX:data.zoneStartX, zoneSize:data.zoneSize};
  } else {
    ctx.beginPath();
    ctx.moveTo(userData[data.user].prevX, userData[data.user].prevY);
    ctx.lineTo(data.x, data.y);
    ctx.strokeStyle = data.color;
    ctx.lineWidth = data.size;
    ctx.lineCap = "round";
    ctx.stroke();
    ctx.closePath();
    userData[data.user].prevX = data.x;
    userData[data.user].prevY = data.y;
  }

  ctx.font = "16px Arial";
  ctx.fillStyle = "#fff";
  ctx.fillText(data.user, userData[data.user].zoneX + 5, 20);
});

socket.on("clearCanvas", ()=>{
  ctx.clearRect(0,0,canvas.width,canvas.height);
  userData = {};
});
</script>
</body>
</html>
