<!DOCTYPE html>
<html>
<head>
  <title>Viewer Drawing</title>
</head>
<body>
  <div>
    Twitch Name: <input id="nameInput" placeholder="Enter Twitch name" />
    Color: <input type="color" id="colorPicker" value="#ff0000" />
    Brush size: <input type="range" id="brushSize" min="1" max="20" value="4" />
  </div>

  <canvas id="c" style="touch-action:none; width:100vw; height:100vh;"></canvas>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const c = document.getElementById("c");
    const ctx = c.getContext("2d");
    c.width = window.innerWidth;
    c.height = window.innerHeight;

    let drawing = false;
    let username = "Anon";
    let color = "#ff0000";
    let brushSize = 4;

    let zoneIndex = 0;
    let zoneWidth = 1; // default full canvas
    let prevX = null;
    let prevY = null;

    document.getElementById("nameInput").addEventListener("change", e => {
      username = e.target.value || "Anon";
    });
    document.getElementById("colorPicker").addEventListener("change", e => {
      color = e.target.value;
    });
    document.getElementById("brushSize").addEventListener("input", e => {
      brushSize = e.target.value;
    });

    socket.on("zoneAssigned", data => {
      zoneIndex = data.index;
      zoneWidth = data.width;
    });

    c.addEventListener("mousedown", () => drawing = true);
    c.addEventListener("mouseup", () => { drawing = false; prevX=null; prevY=null; });
    c.addEventListener("touchstart", () => drawing = true);
    c.addEventListener("touchend", () => { drawing = false; prevX=null; prevY=null; });

    c.addEventListener("mousemove", draw);
    c.addEventListener("touchmove", draw);

    function draw(e) {
      if (!drawing) return;

      let x = e.touches ? e.touches[0].clientX : e.clientX;
      let y = e.touches ? e.touches[0].clientY : e.clientY;

      // clamp to zone
      const zoneStart = zoneIndex * c.width * zoneWidth;
      const zoneEnd = zoneStart + c.width * zoneWidth;
      if (x < zoneStart) x = zoneStart;
      if (x > zoneEnd) x = zoneEnd;

      socket.emit("draw", { x, y, user: username, color, size: brushSize });

      if (prevX !== null && prevY !== null) {
        ctx.beginPath();
        ctx.moveTo(prevX, prevY);
        ctx.lineTo(x, y);
        ctx.strokeStyle = color;
        ctx.lineWidth = brushSize;
        ctx.lineCap = "round";
        ctx.stroke();
        ctx.closePath();

        // username
        ctx.font = "12px Arial";
        ctx.fillStyle = color;
        ctx.fillText(username, x + 5, y + 5);
      }

      prevX = x;
      prevY = y;
    }
  </script>
</body>
</html>
