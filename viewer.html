<!DOCTYPE html>
<html>
<head>
  <title>Draw on Stream</title>
  <style>
    body, html { margin:0; padding:0; overflow:hidden; font-family: Arial, sans-serif; }
    canvas { display:block; touch-action:none; }

    #controls {
      position: fixed; top:10px; left:50%; transform:translateX(-50%);
      background: rgba(0,0,0,0.6); padding:10px; border-radius:12px;
      display:flex; gap:10px; align-items:center; z-index:1000;
    }

    #controls input, #controls button { border:none; border-radius:6px; padding:4px 8px; }
    #controls input[type="text"] { width:120px; }

    #colorPalette {
      display: grid; grid-template-columns: repeat(3, 24px); gap: 4px;
    }

    .color-btn { width:24px; height:24px; border:1px solid #fff; cursor:pointer; border-radius:4px; }
    .color-btn.selected { border: 2px solid #ff0; }
  </style>
</head>
<body>
  <div id="controls">
    <input id="nameInput" placeholder="Twitch name" />
    <div id="colorPalette">
      <div class="color-btn" style="background:#FF0000;"></div>
      <div class="color-btn" style="background:#FF7F00;"></div>
      <div class="color-btn" style="background:#FFFF00;"></div>
      <div class="color-btn" style="background:#00FF00;"></div>
      <div class="color-btn" style="background:#00FFFF;"></div>
      <div class="color-btn" style="background:#0000FF;"></div>
      <div class="color-btn" style="background:#8B00FF;"></div>
      <div class="color-btn" style="background:#FFFFFF;"></div>
      <div class="color-btn" style="background:#000000;"></div>
    </div>
    Brush size: <input type="range" id="brushSize" min="1" max="20" value="4" />
  </div>

  <canvas id="c"></canvas>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const c = document.getElementById("c");
    const ctx = c.getContext("2d");
    c.width = window.innerWidth;
    c.height = window.innerHeight;

    let drawing = false;
    let username = "";
    let color = "#FF0000";
    let brushSize = 4;
    let prevX = null, prevY = null;
    let zoneIndex = 0, zoneWidth = 1;

    // require username to draw
    document.getElementById("nameInput").addEventListener("change", e=>{
      const name = e.target.value.trim();
      if(name.length>0){
        username=name;
      }
    });

    // color selection
    const paletteBtns = document.querySelectorAll(".color-btn");
    paletteBtns.forEach(btn=>{
      btn.addEventListener("click",()=>{
        paletteBtns.forEach(b=>b.classList.remove("selected"));
        btn.classList.add("selected");
        color=btn.style.background;
      });
    });
    paletteBtns[0].classList.add("selected");

    document.getElementById("brushSize").addEventListener("input", e=>brushSize=e.target.value);

    socket.on("zoneAssigned", data=>{
      zoneIndex=data.index;
      zoneWidth=data.width;
    });

    function drawZoneGuide(){
      ctx.clearRect(0,0,c.width,c.height);
      const zoneStart = zoneIndex*c.width*zoneWidth;
      const zoneEnd = zoneStart+c.width*zoneWidth;
      ctx.fillStyle="rgba(255,255,255,0.05)";
      ctx.fillRect(zoneStart,0,zoneEnd-zoneStart,c.height);

      ctx.strokeStyle="rgba(255,255,255,0.3)";
      ctx.lineWidth=2;
      ctx.strokeRect(zoneStart,0,zoneEnd-zoneStart,c.height);
    }

    c.addEventListener("mousedown", ()=>drawing=true);
    c.addEventListener("mouseup", ()=>{drawing=false; prevX=null; prevY=null;});
    c.addEventListener("touchstart", ()=>drawing=true);
    c.addEventListener("touchend", ()=>{drawing=false; prevX=null; prevY=null;});

    c.addEventListener("mousemove", draw);
    c.addEventListener("touchmove", draw);

    function draw(e){
      if(!drawing || username==="") return; // prevent drawing without username
      let x=e.touches?e.touches[0].clientX:e.clientX;
      let y=e.touches?e.touches[0].clientY:e.clientY;

      const zoneStart = zoneIndex*c.width*zoneWidth;
      const zoneEnd = zoneStart+c.width*zoneWidth;
      if(x<zoneStart) x=zoneStart;
      if(x>zoneEnd) x=zoneEnd;

      if(prevX!==null && prevY!==null){
        socket.emit("draw",{x,y,user:username,color,size:brushSize});
        ctx.beginPath();
        ctx.moveTo(prevX,prevY);
        ctx.lineTo(x,y);
        ctx.strokeStyle=color;
        ctx.lineWidth=brushSize;
        ctx.lineCap="round";
        ctx.stroke();
        ctx.closePath();
      }

      prevX=x; prevY=y;
    }

    // continuously show zone
    setInterval(drawZoneGuide, 100);
  </script>
</body>
</html>
