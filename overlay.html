<!DOCTYPE html>
<html>
<head>
  <title>Overlay</title>
  <style>
    html, body { margin:0; padding:0; overflow:hidden; background:transparent; }
    canvas { position:absolute; top:0; left:0; width:100%; height:100%; }
  </style>
</head>
<body>
<canvas id="overlayCanvas"></canvas>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const canvas = document.getElementById("overlayCanvas");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// Track users and their zone top-left positions
let userZones = {};

socket.on("draw", data=>{
  // Draw brush
  ctx.beginPath();
  ctx.arc(data.x, data.y, data.size/2, 0, Math.PI*2);
  ctx.fillStyle = data.color;
  ctx.fill();
  ctx.closePath();

  // Store username position by zone
  if(!userZones[data.user]){
    userZones[data.user] = {x:data.zoneStartX || data.x - 20, y:20};
  }

  // Draw username persistently at top-left of zone
  ctx.font = "16px Arial";
  ctx.fillStyle = "#fff";
  ctx.fillText(data.user, userZones[data.user].x + 5, userZones[data.user].y);
});

socket.on("clearCanvas", ()=>{
  ctx.clearRect(0,0,canvas.width,canvas.height);
  userZones = {};
});
</script>
</body>
</html>
